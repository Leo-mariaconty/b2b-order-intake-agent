# ---------------------------------------------------------------------------
# Colonnes du fichier d'import Odoo (sorties/import_odoo.csv)
#
# Format vérifié le 12/11/2026 dans la documentation Odoo 18, page
# « Export and import data », section « Import one2many relationships » :
#   - une ligne du CSV par ligne de commande ;
#   - les champs de la commande (client, date...) sont remplis sur la première
#     ligne de chaque commande, et laissés vides sur les lignes suivantes.
# Les titres ci-dessous sont ceux du fichier d'exemple officiel
# (o2m-quotations-order-lines.csv), sauf « Customer Reference » et
# « Customer/External ID », à confirmer lors du test dans une vraie base.
#
# Pour ajuster : à gauche le titre de la colonne tel qu'Odoo l'attend, à droite
# ce qu'on y met. Les mots entre accolades sont remplacés par le script.
# Mots disponibles pour la commande : {code_client} {nom_client}
#   {reference_commande} {date_commande} {email_source}
# Mots disponibles pour la ligne : {reference} {ean} {libelle} {quantite}
#   {prix_unitaire}
# ---------------------------------------------------------------------------

# Odoo attend des virgules par défaut (réglable dans son écran d'import).
separateur: ","

# Format de date recommandé par la documentation Odoo.
format_date: "%Y-%m-%d %H:%M:%S"

# Remplies une seule fois, sur la première ligne de chaque commande.
colonnes_commande:
  # Deux pharmacies portent le même nom. La documentation Odoo demande alors
  # d'identifier le client par son identifiant externe plutôt que par son nom.
  # Hypothèse : les clients ont été importés avec l'identifiant « client_CODE ».
  # Pour identifier par le nom à la place :   "Customer": "{nom_client}"
  "Customer/External ID": "client_{code_client}"
  "Customer Reference": "{reference_commande}"
  "Order Date": "{date_commande}"

# Remplies sur chaque ligne.
colonnes_ligne:
  # Même présentation que l'exemple officiel : [référence interne] nom.
  # Odoo 17 et antérieurs : le titre est « Order Lines/Product ».
  "Order Lines/Product Template": "[{reference}] {libelle}"
  "Order Lines/Quantity": "{quantite}"
  "Order Lines/Unit Price": "{prix_unitaire}"
